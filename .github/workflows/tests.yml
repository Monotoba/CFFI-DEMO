name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Compile C and run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run the complete demo
        run: |
          python data_gen.py
          python main.py > demo-output.txt
          python -c "from pathlib import Path; assert len(Path('output.txt').read_text().splitlines()) == 100000"
